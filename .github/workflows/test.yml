name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1', 'lts']
        julia-arch: [x64]
        os: [ubuntu-latest,windows-latest]
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - name: MOI
        shell: julia --project=@. {0}
        run: |
          using Pkg
          Pkg.add([
              PackageSpec(name="MathOptInterface", rev="bl/linearity"),
          ])
      - uses: julia-actions/julia-buildpkg@latest
      - name: Run tests
        env:
          # juliac needs a C toolchain to link the AOT executable, and the
          # hosted Windows image has no C runtime headers on the include path:
          # every `juliac compiles ...` test dies with
          # `julia/libsupport.h:8:10: fatal error: stdlib.h: No such file or
          # directory`. Skip AOT there, as the self-hosted legs already do.
          EXAMODELS_SKIP_AOT: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        run: |
          julia --startup-file=no --color=yes --code-coverage=user --project=./test -e '
            using Pkg
            Pkg.develop(path=".")
            Pkg.instantiate()
            include("test/runtests.jl")'
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.julia-version == '1' && matrix.os == 'ubuntu-latest'
        with:
          directories: src,ext
      - uses: codecov/codecov-action@v5
        if: matrix.julia-version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          # Each job covers a different slice of src; flag the uploads so
          # Codecov merges the partial reports for a commit instead of
          # treating each as a replacement. Token, not OIDC: OIDC uploads
          # broke on the org transfer ("Repository not found") while
          # token-authenticated uploads kept working.
          flags: github
          token: ${{ secrets.CODECOV_TOKEN }}
          # The org-wide token cannot imply a repository; the slug says
          # which repo this upload is for.
          slug: ${{ github.repository }}

  cpu:
    strategy:
      matrix:
        julia-version: ['1', 'lts']
        julia-arch: [x64]
        os: [ubuntu-latest]
    runs-on: ['self-hosted', 'shin-compute']
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Setup Julia
      uses: julia-actions/setup-julia@latest
      with:
        version: ${{ matrix.julia-version }}
    - name: Setup tests
      run: |
        julia --startup-file=no --color=yes --project=./test -e '
          using Pkg
          Pkg.Registry.update()
          Pkg.develop(path=".")
          Pkg.instantiate()'
    - name: Add OpenCL.jl to test environment
      run: |
        julia --startup-file=no --project=test -e 'using Pkg; Pkg.add(["OpenCL", "pocl_jll"])'
    - name: Run tests
      env:
        EXAMODELS_SKIP_AOT: "1"
      # Coverage only on the julia-version 1 leg: the KernelAbstractions and
      # OpenCL extension lines are exercised here and nowhere on the hosted
      # runners, and one instrumented leg is enough for the report.
      run: |
        julia --startup-file=no --color=yes ${{ matrix.julia-version == '1' && '--code-coverage=user' || '' }} --project=./test -e '
          push!(ARGS, "EXAMODELS_NO_TEST_CPU")
          push!(ARGS, "EXAMODELS_TEST_KA")
          push!(ARGS, "EXAMODELS_TEST_POCL")
          include("test/runtests.jl")'
    - uses: julia-actions/julia-processcoverage@v1
      if: matrix.julia-version == '1'
      with:
        directories: src,ext
    - uses: codecov/codecov-action@v5
      if: matrix.julia-version == '1'
      with:
        files: lcov.info
        flags: cpu
        token: ${{ secrets.CODECOV_TOKEN }}
        # The org-wide token cannot imply a repository; the slug says
        # which repo this upload is for.
        slug: ${{ github.repository }}

  gpu:
    strategy:
      matrix:
        julia-version: ['1', 'lts']
        julia-arch: [x64]
        os: [ubuntu-latest]
        backend: ['cuda', 'amdgpu', 'oneapi']
        exclude:
          - julia-version: 'lts'
            backend: 'oneapi'
    runs-on: ['self-hosted', 'gpu', '${{ matrix.backend }}', 'shin-compute']
    continue-on-error: ${{ matrix.backend == 'oneapi' }}
    env:
      # oneAPI specific variables
      OverrideDefaultFP64Settings: ${{ matrix.backend == 'oneapi' && '1' || '' }}
      IGC_EnableDPEmulation: ${{ matrix.backend == 'oneapi' && '1' || '' }}
      # opt out of MPS on the self-hosted runner
      CUDA_MPS_PIPE_DIRECTORY: /tmp/no-mps-${{ github.run_id }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Setup Julia
      uses: julia-actions/setup-julia@latest
      with:
        version: ${{ matrix.julia-version }}
    - name: Setup tests
      run: |
        julia --startup-file=no --color=yes --project=./test -e '
          using Pkg
          Pkg.Registry.update()
          Pkg.develop(path=".")
          Pkg.instantiate()'
    - name: Add AMDGPU.jl to test environment
      if: matrix.backend == 'amdgpu'
      run: |
        julia --startup-file=no --project=test -e 'using Pkg; Pkg.add("AMDGPU")'
    - name: Add CUDA.jl to test environment
      if: matrix.backend == 'cuda'
      run: |
        julia --startup-file=no --project=test -e 'using Pkg; Pkg.add("CUDA")'
    - name: Add oneAPI.jl to test environment
      if: matrix.backend == 'oneapi'
      run: |
        julia --startup-file=no --project=test -e 'using Pkg; Pkg.add("oneAPI")'
    - name: Run tests
      env:
        EXAMODELS_SKIP_AOT: "1"
      # Coverage from the CUDA leg on julia-version 1 only: it exercises the
      # device paths of the KernelAbstractions extension; the other backends
      # walk the same extension lines and need no second instrumented run.
      run: |
        julia --startup-file=no --color=yes ${{ matrix.julia-version == '1' && matrix.backend == 'cuda' && '--code-coverage=user' || '' }} --project=./test -e '
          push!(ARGS, "EXAMODELS_NO_TEST_CPU")
          push!(ARGS, "EXAMODELS_TEST_" * uppercase("${{ matrix.backend }}"))
          include("test/runtests.jl")'
    - uses: julia-actions/julia-processcoverage@v1
      if: matrix.julia-version == '1' && matrix.backend == 'cuda'
      with:
        directories: src,ext
    - uses: codecov/codecov-action@v5
      if: matrix.julia-version == '1' && matrix.backend == 'cuda'
      with:
        files: lcov.info
        flags: gpu-${{ matrix.backend }}
        token: ${{ secrets.CODECOV_TOKEN }}
        # The org-wide token cannot imply a repository; the slug says
        # which repo this upload is for.
        slug: ${{ github.repository }}

  metal:
    strategy:
      matrix:
        julia-version: ['1', 'lts']
        julia-arch: [aarch64]
        os: [macos-latest]
        backend: ['metal']
    runs-on: ['self-hosted', 'gpu', '${{ matrix.backend }}']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Julia
        uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - name: Setup tests
        run: |
          julia --startup-file=no --color=yes --project=./test -e '
            using Pkg
            Pkg.Registry.update()
            Pkg.develop(path=".")
            Pkg.instantiate()'
      - name: Add Metal.jl to test environment
        run: |
          julia --startup-file=no --project=test -e 'using Pkg; Pkg.add("Metal")'
      - name: Show platform info
        run: |
          uname -a
          julia --startup-file=no -e 'println(Sys.ARCH); println(Sys.KERNEL)'
      - name: Run tests
        run: |
          julia --startup-file=no --color=yes --project=./test -e '
            push!(ARGS, "EXAMODELS_NO_TEST_CPU")
            push!(ARGS, "EXAMODELS_TEST_METAL")
            include("test/runtests.jl")'

  # ── Benchmarks (run after all tests pass, PRs only) ───────────────────────────
  bench-nothing:
    if: github.event_name == 'pull_request'
    needs: [github, cpu, gpu, metal]
    runs-on: ['self-hosted', 'shin-compute']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Instantiate
        working-directory: benchmark
        run: |
          julia --startup-file=no --project=main    -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate()'
          julia --startup-file=no --project=current -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate()'
      - name: Run benchmark (main)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl main nothing
      - name: Run benchmark (current)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl current nothing
      - uses: actions/upload-artifact@v4
        with:
          name: results-nothing
          path: benchmark/benchmark-results-*.csv

  bench-cuda:
    if: github.event_name == 'pull_request'
    needs: [github, cpu, gpu, metal]
    runs-on: ['self-hosted', 'gpu', 'cuda', 'shin-compute']
    env:
      # opt out of MPS on the self-hosted runner
      CUDA_MPS_PIPE_DIRECTORY: /tmp/no-mps-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Instantiate
        working-directory: benchmark
        run: |
          julia --startup-file=no --project=main    -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate(); Pkg.add("CUDA")'
          julia --startup-file=no --project=current -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate(); Pkg.add("CUDA")'
      - name: Run benchmark (main)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl main cuda
      - name: Run benchmark (current)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl current cuda
      - uses: actions/upload-artifact@v4
        with:
          name: results-cuda
          path: benchmark/benchmark-results-*.csv

  bench-amdgpu:
    if: github.event_name == 'pull_request'
    needs: [github, cpu, gpu, metal]
    runs-on: ['self-hosted', 'gpu', 'amdgpu', 'shin-compute']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Instantiate
        working-directory: benchmark
        run: |
          julia --startup-file=no --project=main    -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate(); Pkg.add("AMDGPU")'
          julia --startup-file=no --project=current -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate(); Pkg.add("AMDGPU")'
      - name: Run benchmark (main)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl main amdgpu
      - name: Run benchmark (current)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl current amdgpu
      - uses: actions/upload-artifact@v4
        with:
          name: results-amdgpu
          path: benchmark/benchmark-results-*.csv

  bench-oneapi:
    if: github.event_name == 'pull_request'
    needs: [github, cpu, gpu, metal]
    runs-on: ['self-hosted', 'gpu', 'oneapi', 'shin-compute']
    continue-on-error: true
    env:
      OverrideDefaultFP64Settings: '1'
      IGC_EnableDPEmulation: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Instantiate
        working-directory: benchmark
        run: |
          julia --startup-file=no --project=main    -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate(); Pkg.add("oneAPI")'
          julia --startup-file=no --project=current -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate(); Pkg.add("oneAPI")'
      - name: Run benchmark (main)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl main oneapi
      - name: Run benchmark (current)
        working-directory: benchmark
        run: julia --startup-file=no runbenchmark.jl current oneapi
      - uses: actions/upload-artifact@v4
        with:
          name: results-oneapi
          path: benchmark/benchmark-results-*.csv

  compare:
    needs: [bench-nothing, bench-cuda, bench-amdgpu, bench-oneapi]
    if: always() && github.event_name == 'pull_request' && contains(needs.*.result, 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Instantiate
        working-directory: benchmark
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate()'
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: benchmark
          merge-multiple: true
      - name: Compare
        working-directory: benchmark
        run: julia --startup-file=no --project=. compare.jl | tee comparison.txt
      - name: Save PR number
        working-directory: benchmark
        run: echo "${{ github.event.pull_request.number }}" > pr_number.txt
      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: |
            benchmark/comparison.txt
            benchmark/pr_number.txt

  # ExaModelsCompiler compiles a model into a native shared library with juliac, so it
  # is platform-specific in a way the rest of the package is not. Not on GPU
  # runners, where it is not expected to work yet, and not on Windows: juliac
  # implements runtime privatization only for Linux and macOS, so a library
  # compiled there cannot be loaded back into Julia (see `compile_library`).
  examodelscompiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: '["self-hosted","Linux","shin-compute"]'
            name: linux
          - runner: '["self-hosted","macOS"]'
            name: macos
    name: examodelscompiler (${{ matrix.name }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@v4
      # The Python consumer is an unrelated package and not a Julia dependency;
      # the test finds it through CNLPMODELS_PY and skips the leg if absent.
      - uses: actions/checkout@v4
        with:
          repository: madsuite-org/cnlpmodels-py
          ref: master
          path: cnlpmodels-py
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      # No julia-actions/cache here: both legs are self-hosted with
      # persistent per-runner depots, so a GitHub cache round-trip is pure
      # overhead (and one gigabyte-scale save stalled the mac leg for 15 min).
      # No `setup-python` here: both legs are self-hosted, and that action
      # assumes the hosted layout — it tries to write to `/Users/runner`, which
      # on a self-hosted Mac does not exist (`mkdir: Permission denied`), and
      # takes the job with it. The runners have their own Python; the test
      # probes for one with numpy and skips that leg when it finds none.
      - name: Run ExaModelsCompiler tests
        env:
          CNLPMODELS_PY: ${{ github.workspace }}/cnlpmodels-py/src
        # The linux leg is instrumented so ExaModelsCompiler/src reaches the coverage
        # report; the mac leg runs the same tests uninstrumented.
        run: |
          julia --startup-file=no --color=yes ${{ matrix.name == 'linux' && '--code-coverage=user' || '' }} --project=ExaModelsCompiler/test -e '
            using Pkg
            Pkg.instantiate()
            include("ExaModelsCompiler/test/runtests.jl")'
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.name == 'linux'
        with:
          directories: ExaModelsCompiler/src
      - uses: codecov/codecov-action@v5
        if: matrix.name == 'linux'
        with:
          files: lcov.info
          flags: examodelscompiler
          token: ${{ secrets.CODECOV_TOKEN }}
          # The org-wide token cannot imply a repository; the slug says
          # which repo this upload is for.
          slug: ${{ github.repository }}
